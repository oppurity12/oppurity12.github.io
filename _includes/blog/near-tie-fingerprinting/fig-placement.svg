<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 0 924 638" width="100%" role="img" aria-labelledby="fp-title" font-family="inherit" fill="currentColor">
  <title id="fp-title">Illustrative teacher distributions: boosting near-tie tokens or a random green subset with the same base probability mass gives identical green-token probability and KL divergence, but near-tie produces a smaller (still positive) shift in expected base-model surprisal. With a bias of log 3, the illustrative shifts are plus 0.06 and plus 0.37 nats.</title>

  <line x1="480" y1="22" x2="480" y2="396" stroke="currentColor" stroke-opacity="0.25" stroke-width="1"/>

  <text x="20" y="38" font-size="28" font-weight="700" fill="var(--blog-accent, #2f6fde)">Near-tie placement</text>
  <text x="20" y="67" font-size="18" fill="var(--blog-muted, #6a737d)">boost the green tokens nearest the top-1</text>
  <text x="20" y="90" font-size="16" fill="var(--blog-muted, #6a737d)">33% of the base probability</text>

  <text x="106" y="136" font-size="18" text-anchor="end">canapé</text>
  <circle cx="118" cy="130" r="4" fill="var(--blog-red, #d64545)" fill-opacity="0.8"/>
  <rect x="130" y="119" width="282" height="22" rx="3" fill="currentColor" fill-opacity="0.3"/>
  <rect x="130" y="125" width="170" height="10" rx="2" fill="currentColor" fill-opacity="0.6"/>

  <text x="106" y="170" font-size="18" text-anchor="end">lit</text>
  <circle cx="118" cy="164" r="4" fill="var(--blog-green, #2e9e5b)" fill-opacity="0.8"/>
  <rect x="130" y="153" width="128" height="22" rx="3" fill="currentColor" fill-opacity="0.3"/>
  <rect x="130" y="159" width="231" height="10" rx="2" fill="var(--blog-green, #2e9e5b)"/>

  <text x="106" y="204" font-size="18" text-anchor="end">tapis</text>
  <circle cx="118" cy="198" r="4" fill="var(--blog-green, #2e9e5b)" fill-opacity="0.8"/>
  <rect x="130" y="187" width="83" height="22" rx="3" fill="currentColor" fill-opacity="0.3"/>
  <rect x="130" y="193" width="150" height="10" rx="2" fill="var(--blog-green, #2e9e5b)"/>

  <text x="106" y="238" font-size="18" text-anchor="end">sol</text>
  <circle cx="118" cy="232" r="4" fill="var(--blog-green, #2e9e5b)" fill-opacity="0.8"/>
  <rect x="130" y="221" width="45" height="22" rx="3" fill="currentColor" fill-opacity="0.3"/>
  <rect x="130" y="227" width="27" height="10" rx="2" fill="currentColor" fill-opacity="0.6"/>

  <text x="106" y="272" font-size="18" text-anchor="end">fauteuil</text>
  <circle cx="118" cy="266" r="4" fill="var(--blog-green, #2e9e5b)" fill-opacity="0.8"/>
  <rect x="130" y="255" width="38" height="22" rx="3" fill="currentColor" fill-opacity="0.3"/>
  <rect x="130" y="261" width="23" height="10" rx="2" fill="currentColor" fill-opacity="0.6"/>

  <text x="106" y="306" font-size="18" text-anchor="end">coussin</text>
  <circle cx="118" cy="300" r="4" fill="var(--blog-green, #2e9e5b)" fill-opacity="0.8"/>
  <rect x="130" y="289" width="32" height="22" rx="3" fill="currentColor" fill-opacity="0.3"/>
  <rect x="130" y="295" width="19" height="10" rx="2" fill="currentColor" fill-opacity="0.6"/>

  <text x="106" y="340" font-size="18" text-anchor="end">radiateur</text>
  <circle cx="118" cy="334" r="4" fill="var(--blog-green, #2e9e5b)" fill-opacity="0.8"/>
  <rect x="130" y="323" width="13" height="22" rx="3" fill="currentColor" fill-opacity="0.3"/>
  <rect x="130" y="329" width="8" height="10" rx="2" fill="currentColor" fill-opacity="0.6"/>

  <text x="106" y="374" font-size="18" text-anchor="end">clavier</text>
  <circle cx="118" cy="368" r="4" fill="var(--blog-green, #2e9e5b)" fill-opacity="0.8"/>
  <rect x="130" y="357" width="19" height="22" rx="3" fill="currentColor" fill-opacity="0.3"/>
  <rect x="130" y="363" width="12" height="10" rx="2" fill="currentColor" fill-opacity="0.6"/>

  <text x="510" y="38" font-size="28" font-weight="700" fill="currentColor">Random placement</text>
  <text x="510" y="67" font-size="18" fill="var(--blog-muted, #6a737d)">a random subset of the green tokens</text>
  <text x="510" y="90" font-size="16" fill="var(--blog-muted, #6a737d)">33% of the base probability</text>

  <text x="596" y="136" font-size="18" text-anchor="end">canapé</text>
  <circle cx="608" cy="130" r="4" fill="var(--blog-red, #d64545)" fill-opacity="0.8"/>
  <rect x="620" y="119" width="282" height="22" rx="3" fill="currentColor" fill-opacity="0.3"/>
  <rect x="620" y="125" width="170" height="10" rx="2" fill="currentColor" fill-opacity="0.6"/>

  <text x="596" y="170" font-size="18" text-anchor="end">lit</text>
  <circle cx="608" cy="164" r="4" fill="var(--blog-green, #2e9e5b)" fill-opacity="0.8"/>
  <rect x="620" y="153" width="128" height="22" rx="3" fill="currentColor" fill-opacity="0.3"/>
  <rect x="620" y="159" width="77" height="10" rx="2" fill="currentColor" fill-opacity="0.6"/>

  <text x="596" y="204" font-size="18" text-anchor="end">tapis</text>
  <circle cx="608" cy="198" r="4" fill="var(--blog-green, #2e9e5b)" fill-opacity="0.8"/>
  <rect x="620" y="187" width="83" height="22" rx="3" fill="currentColor" fill-opacity="0.3"/>
  <rect x="620" y="193" width="150" height="10" rx="2" fill="var(--blog-green, #2e9e5b)"/>

  <text x="596" y="238" font-size="18" text-anchor="end">sol</text>
  <circle cx="608" cy="232" r="4" fill="var(--blog-green, #2e9e5b)" fill-opacity="0.8"/>
  <rect x="620" y="221" width="45" height="22" rx="3" fill="currentColor" fill-opacity="0.3"/>
  <rect x="620" y="227" width="81" height="10" rx="2" fill="var(--blog-green, #2e9e5b)"/>

  <text x="596" y="272" font-size="18" text-anchor="end">fauteuil</text>
  <circle cx="608" cy="266" r="4" fill="var(--blog-green, #2e9e5b)" fill-opacity="0.8"/>
  <rect x="620" y="255" width="38" height="22" rx="3" fill="currentColor" fill-opacity="0.3"/>
  <rect x="620" y="261" width="69" height="10" rx="2" fill="var(--blog-green, #2e9e5b)"/>

  <text x="596" y="306" font-size="18" text-anchor="end">coussin</text>
  <circle cx="608" cy="300" r="4" fill="var(--blog-green, #2e9e5b)" fill-opacity="0.8"/>
  <rect x="620" y="289" width="32" height="22" rx="3" fill="currentColor" fill-opacity="0.3"/>
  <rect x="620" y="295" width="58" height="10" rx="2" fill="var(--blog-green, #2e9e5b)"/>

  <text x="596" y="340" font-size="18" text-anchor="end">radiateur</text>
  <circle cx="608" cy="334" r="4" fill="var(--blog-green, #2e9e5b)" fill-opacity="0.8"/>
  <rect x="620" y="323" width="13" height="22" rx="3" fill="currentColor" fill-opacity="0.3"/>
  <rect x="620" y="329" width="23" height="10" rx="2" fill="var(--blog-green, #2e9e5b)"/>

  <text x="596" y="374" font-size="18" text-anchor="end">clavier</text>
  <circle cx="608" cy="368" r="4" fill="var(--blog-green, #2e9e5b)" fill-opacity="0.8"/>
  <rect x="620" y="357" width="19" height="22" rx="3" fill="currentColor" fill-opacity="0.3"/>
  <rect x="620" y="363" width="12" height="10" rx="2" fill="currentColor" fill-opacity="0.6"/>

  <!-- These values are calculated from the illustrative distributions above,
       with an identical bias of log 3. They are not student-model results. -->
  <rect x="20" y="409" width="428" height="102" rx="8" fill="var(--blog-soft-bg, #f6f8fa)"/>
  <rect x="510" y="409" width="430" height="102" rx="8" fill="var(--blog-soft-bg, #f6f8fa)"/>
  <text x="234" y="438" font-size="17" text-anchor="middle" fill="var(--blog-muted, #6a737d)">Expected base-model surprisal shift</text>
  <text x="725" y="438" font-size="17" text-anchor="middle" fill="var(--blog-muted, #6a737d)">Expected base-model surprisal shift</text>
  <text x="234" y="485" font-size="36" font-weight="700" text-anchor="middle" fill="var(--blog-accent, #2f6fde)">+0.06</text>
  <text x="725" y="485" font-size="36" font-weight="700" text-anchor="middle">+0.37</text>

  <text x="480" y="545" font-size="18" text-anchor="middle">Both teachers: green probability 0.56 → 0.73 · KL 0.15</text>
  <text x="480" y="571" font-size="16" text-anchor="middle" fill="var(--blog-muted, #6a737d)">Illustrative teacher distributions · δ = log 3 · surprisal shift in nats</text>

  <circle cx="30" cy="612" r="4" fill="var(--blog-green, #2e9e5b)" fill-opacity="0.8"/>
  <circle cx="42" cy="612" r="4" fill="var(--blog-red, #d64545)" fill-opacity="0.8"/>
  <text x="54" y="618" font-size="16" fill="var(--blog-muted, #6a737d)">green / red list</text>
  <rect x="196" y="604" width="26" height="16" rx="3" fill="currentColor" fill-opacity="0.3"/>
  <text x="230" y="618" font-size="16" fill="var(--blog-muted, #6a737d)">base probability</text>
  <rect x="374" y="607" width="26" height="10" rx="2" fill="currentColor" fill-opacity="0.6"/>
  <text x="408" y="618" font-size="16" fill="var(--blog-muted, #6a737d)">teacher, not boosted (shrinks)</text>
  <rect x="672" y="607" width="26" height="10" rx="2" fill="var(--blog-green, #2e9e5b)"/>
  <text x="706" y="618" font-size="16" fill="var(--blog-muted, #6a737d)">teacher, boosted (+δ)</text>
</svg>
